<!doctype html><html lang="ko"><meta charset="utf-8"><title>PSD Exporter Prototype</title><style>body{font:14px system-ui;padding:20px;color:#222}button{width:100%;padding:12px;border:0;border-radius:8px;background:#242424;color:white;font-weight:bold}p,small{line-height:1.6;color:#666}</style><h2>PSD Exporter</h2><p>Penpot에서 프레임 하나를 선택하세요.</p><button id="export">프레임 데이터 추출</button><p id="status"></p><small>현재 버전은 JSON만 지원합니다. 편집 가능한 PSD 생성은 아직 구현되지 않았습니다.</small><script>document.querySelector('#export').onclick=()=>parent.postMessage({type:'export'},'*');window.addEventListener('message',e=>{const m=e.data;if(m?.type==='error')document.querySelector('#status').textContent=m.message;if(m?.type==='result'){const blob=new Blob([JSON.stringify(m.data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='penpot-board.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);document.querySelector('#status').textContent='JSON 다운로드 완료';}});</script></html>
